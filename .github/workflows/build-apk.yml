# CEVIRI - Android APK derleme + web surumu (GitHub Pages)
# Her push'ta (veya Actions sekmesinden "Run workflow" ile elle) calisir.
#
# build: APK'yi derler. Cikti: Releases bolumunde CEVIRI.apk
#        (ve Actions > calisma > Artifacts > CEVIRI-apk)
# web:   Ayni uygulamayi https://<kullanici>.github.io/<depo>/ adresinde
#        yayinlar. APK'daki davet linkleri bu adrese gider; uygulamasi olmayan
#        telefonlar (iPhone dahil) odaya tarayicidan katilir.

name: Android APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Kodlari al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub'in ubuntu sunucularinda Android SDK hazir kurulu gelir (ANDROID_HOME)
      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Bagimliliklari yukle
        run: npm ci

      - name: Testleri calistir (ses, ceviri, online oda)
        run: npm test

      - name: Davet linki adresini yaz (GitHub Pages)
        run: node scripts/write-web-url.js

      - name: Web dosyalarini Android projesine kopyala (cap sync)
        run: npm run sync

      # Imza anahtari GitHub Secrets'tan gelir (depoda yok):
      #   CEVIRI_KEYSTORE_BASE64   - anahtar dosyasinin base64 hali
      #   CEVIRI_KEYSTORE_PASSWORD - anahtar sifresi
      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_B64: ${{ secrets.CEVIRI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CEVIRI_KEYSTORE_BASE64 secret'i tanimli degil. README'deki 'Imza anahtari' bolumune bakin."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ceviri.keystore"
          echo "CEVIRI_KEYSTORE_PATH=$RUNNER_TEMP/ceviri.keystore" >> "$GITHUB_ENV"

      - name: APK derle
        working-directory: android
        env:
          CEVIRI_KEYSTORE_PASSWORD: ${{ secrets.CEVIRI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK'yi yeniden adlandir ve imzayi dogrula
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/CEVIRI.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs out/CEVIRI.apk > out/imza.txt
          grep -i -E "verified using|certificate (DN|SHA-256)" out/imza.txt
          grep -q "CN=CEVIRI" out/imza.txt || { echo "::error::APK CEVIRI anahtariyla imzalanmamis"; cat out/imza.txt; exit 1; }
          rm -f out/imza.txt
          # Saat uygulamasi (Galaxy Watch / Wear OS): ayni anahtarla imzali olmali
          cp android/wear/build/outputs/apk/release/wear-release.apk out/CEVIRI-saat.apk
          "$APKSIGNER" verify --print-certs out/CEVIRI-saat.apk > out/imza-saat.txt
          grep -q "CN=CEVIRI" out/imza-saat.txt || { echo "::error::Saat APK'si CEVIRI anahtariyla imzalanmamis"; cat out/imza-saat.txt; exit 1; }
          rm -f out/imza-saat.txt
          rm -f "$RUNNER_TEMP/ceviri.keystore"
          ls -la out

      - name: APK'yi Artifacts olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: CEVIRI-apk
          path: |
            out/CEVIRI.apk
            out/CEVIRI-saat.apk
          if-no-files-found: error

      - name: Releases bolumune ekle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CEVIRI v1.0.${{ github.run_number }}
          body: |
            Android icin CEVIRI uygulamasi. Telefona CEVIRI.apk dosyasini indirip acin.
            Galaxy Watch / Wear OS saat icin: CEVIRI-saat.apk (saate yuklenir).
            (Ilk kurulumda "bilinmeyen kaynaklardan yukleme" izni istenir.)
            v1.0.5 oncesi bir surum yukluyse: imza anahtari degistigi icin eski uygulamayi bir kez silip bu surumu kurun.
          files: |
            out/CEVIRI.apk
            out/CEVIRI-saat.apk

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Kodlari al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari yukle
        run: npm ci

      - name: Web dosyalarini hazirla
        run: |
          npm run copy-core
          node scripts/write-web-url.js
          touch www/.nojekyll

      - name: GitHub Pages ayarla
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Web surumunu yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Yayinla
        id: deploy
        uses: actions/deploy-pages@v4

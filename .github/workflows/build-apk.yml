# CEVIRI - Android APK derleme + web surumu (GitHub Pages)
# Her push'ta (veya Actions sekmesinden "Run workflow" ile elle) calisir.
#
# build: APK'yi derler. Cikti: Releases bolumunde CEVIRI.apk
#        (ve Actions > calisma > Artifacts > CEVIRI-apk)
# web:   Ayni uygulamayi https://<kullanici>.github.io/<depo>/ adresinde
#        yayinlar. APK'daki davet linkleri bu adrese gider; uygulamasi olmayan
#        telefonlar (iPhone dahil) odaya tarayicidan katilir.

name: Android APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Kodlari al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub'in ubuntu sunucularinda Android SDK hazir kurulu gelir (ANDROID_HOME)
      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Bagimliliklari yukle
        run: npm ci

      - name: Testleri calistir (ses, ceviri, online oda)
        run: npm test

      - name: Davet linki adresini yaz (GitHub Pages)
        run: node scripts/write-web-url.js

      - name: Web dosyalarini Android projesine kopyala (cap sync)
        run: npm run sync

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yi yeniden adlandir
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CEVIRI.apk
          ls -la out

      - name: APK'yi Artifacts olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: CEVIRI-apk
          path: out/CEVIRI.apk
          if-no-files-found: error

      - name: Releases bolumune ekle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CEVIRI v1.0.${{ github.run_number }}
          body: |
            Android icin CEVIRI uygulamasi. Telefona CEVIRI.apk dosyasini indirip acin.
            (Ilk kurulumda "bilinmeyen kaynaklardan yukleme" izni istenir.)
          files: out/CEVIRI.apk

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Kodlari al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari yukle
        run: npm ci

      - name: Web dosyalarini hazirla
        run: |
          npm run copy-core
          node scripts/write-web-url.js
          touch www/.nojekyll

      - name: GitHub Pages ayarla
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Web surumunu yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Yayinla
        id: deploy
        uses: actions/deploy-pages@v4
